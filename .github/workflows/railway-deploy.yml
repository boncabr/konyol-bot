name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Railway Redeploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger redeploy via Railway API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceRedeploy(serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\") }"
            }' \
            https://backboard.railway.app/graphql/v2)

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Railway redeploy gagal (HTTP $RESPONSE)"
            exit 1
          fi

          echo "Railway redeploy berhasil dipicu."
