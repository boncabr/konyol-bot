server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - WEB
      - WEBEMBEDDED
      - ANDROID
      - IOS
      - TVHTML5EMBEDDED
    # YouTube cookies untuk bypass auth error (isi cookies.txt dengan format Netscape)
    cookiesPath: "/app/cookies.txt"
    pot:
      token: ""
      visitorData: ""
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "ytmsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
    spotify:
      clientId: ""
      clientSecret: ""
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
  # ── SponsorBlock: skip segmen sponsor/intro/outro otomatis di YouTube ──
  sponsorblock:
    categories:
      - "sponsor"
      - "selfPromo"
      - "interaction"
      - "intro"
      - "outro"
      - "preview"
      - "filler"
      - "music_offtopic"
  # ── Lyrics: lirik lagu dari YouTube (timed) atau Genius (teks) ──
  lyrics:
    countryCode: id
    # geniusApiKey: ""  # opsional — aktifkan jika ingin fallback ke Genius
    #                     Dapatkan key dari https://genius.com/api-clients

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.4.0"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1"
      repository: "https://jitpack.io"
    - dependency: "me.duncte123:java-lyrics-plugin:1.6.6"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "Ariekonur0"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: false
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    # ── v4.0.8: Non-allocating frame buffers (hemat memori server) ──
    nonAllocating: true
    bufferDurationMs: 200
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    # ── v4.0.8: Seek ghosting untuk seek yang lebih mulus ──
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 2
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: "production"

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
