server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Plugin SponsorBlock (opsional — skip intro/sponsor otomatis)
    # - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.3"
    #   snapshot: false

  server:
    password: "youshallnotpass"
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    # ─── TRUE STEREO AUDIO (DEFAULT) ───────────────────────────────────────────
    # All music streams output in 2-channel stereo (48kHz Opus codec)
    # User does NOT need to enable stereo — it is always on
    # 
    # ffmpeg digunakan saat ada filter aktif atau volume != 100.
    # Dengan volume=100 dan tanpa filter, Lavalink meneruskan stream Opus
    # langsung dari YouTube tanpa decode-encode ulang (passthrough).
    filters:
      volume: true
      equalizer: true          # ← For bass-smooth EQ on all tracks
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true          # ← STEREO: Force 2-channel mixing (ALWAYS ENABLED)
      lowPass: true
      highPass: true            # ← For clarity on stereo output

    # Buffer 400ms untuk meminimalkan dropout saat jaringan fluktuatif
    bufferDurationMs: 200

    # Frame buffer: 5000ms — cukup untuk latensi tinggi
    frameBufferDurationMs: 5000

    # ─── Opus Encoding (Stereo Optimal) ────────────────────────────────────────
    # Sample rate: 48kHz (Discord standard untuk Opus codec)
    # Channels: 2 (stereo — left + right channel)
    # Quality: Maximum
    
    # Opus encoding quality (0=terburuk, 10=terbaik)
    opusEncodingQuality: 10

    # Resampling quality saat sumber bukan 48kHz
    resamplingQuality: HIGH

    # Jumlah thread untuk encoding (0 = auto)
    trackStuckThresholdMs: 10000

    # Nonaktifkan GC warnings
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: false

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""

spring:
  mvc:
    async:
      request-timeout: 100s
